name: Add topic word cloud

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate word cloud
        uses: stefani-gifta/wordcloud-repo-topics@main
        with:
          token: ${{ secrets.WORDCLOUD_TOKEN }}
          svg_width: '750'
          svg_height: '350'
          min_font_size: '12'
          max_font_size: '28'
          color: '23f7ff'
          commit_msg: '💜 update word cloud'
